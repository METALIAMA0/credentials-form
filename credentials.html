<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="nav">
        <button class="menu-toggle" id="menuToggle">&#9776;</button>
        <h1>Daniel DataWorld</h1>

        <a href="day-11.html">Home</a>
        <a href="credentials.html">Credentials</a>
    </div>

    <div class="section">

        <h2>My Credentials</h2>

        <p>
            Welcome to my credentials page.<br>
            Fill in the form below to get in touch with me.
        </p>

        <div class="form-container">

            <h3>Contact Me</h3>

            <form action="https://formspree.io/f/xaeqkkeb"
                  method="POST"
                  id="contactForm">

                <div>
                    <label for="name">Full Name</label>
                    <input
                        id="name"
                        class="form-input"
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div>
                    <label for="email">Email Address</label>
                    <input
                        id="email"
                        class="form-input"
                        type="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div>
                    <label for="phone">Phone Number</label>
                    <input
                        id="phone"
                        class="form-input"
                        type="tel"
                        name="phone"
                        placeholder="Enter your phone number"
                        pattern="[0-9+() -]{7,20}"
                        title="Enter a valid phone number"
                        required>
                </div>

                <div>
                    <label for="education">Educational Level</label>
                    <input
                        id="education"
                        class="form-input"
                        type="text"
                        name="education"
                        placeholder="Educational level"
                        required>
                </div>

                <div>
                    <label for="City">City</label>
                    <input
                        id="City"
                        class="form-input"
                        type="text"
                        name="city"
                        placeholder="City"
                        required>
                </div>

                <div>
                    <label for="Skills">Skills</label>
                    <input
                        id="Skills"
                        class="form-input"
                        type="text"
                        name="skills"
                        placeholder="Skills acquired"
                        required>
                </div>

                <div>
                    <label for="messages">Messages</label>
                    <textarea
                        id="messages"
                        class="form-input"
                        name="messages"
                        placeholder="Drop a message"
                        required></textarea>
                </div>

                <button class="submit-btn" type="submit" id="submit">
                    Submit
                </button>

                <button
                    id="clearButton"
                    class="submit-btn clear-btn"
                    type="button"
                    onclick="clearAll()">
                    Clear
                </button>

                <div class="div-1"></div>

            </form>

        </div>

    </div>

    <footer>
        <p>&copy; 2026 Daniel DataWorld. All rights reserved.</p>
    </footer>

    <script>
        // Listen for the form submission event
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            // Optional: If you want to make sure all required fields are filled before alerting
            if (this.checkValidity()) {
                alert("Successfully Submitted!");
            }
        });

        function clearAll() {
            document.getElementById("contactForm").reset();
        }
    </script>
</body>
</html>
