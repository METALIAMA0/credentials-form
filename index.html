<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <header>
            <nav>

            </nav>
        </header>
        <main>
            <form action="#" method="post">

                <fieldset>
                    <legend>Personal Information</legend>

                    <p>
                        <label for="fullName">
                            Full Name
                        </label>
                        <br>

                        <input
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="Fullname"
                            required
                        >
                    </p>

                    <p>
                        <label for="email">
                            Email Address
                        </label>
                        <br>

                        <input
                          type="text"
                            id="email"
                            name="email"
                            placeholder="name example@gmail.com"
                            required>

                    <p>
                        <label for="phone">
                            phone number
                        </label>
                        <br>
                        <input
                         type="text"
                            id="phone"
                            name="phone"
                            placeholder="+234 08037199387"
                            required>
                    </p>
                <p>
                    <label for="Date of birth">
                        date of birth
                         </label>
                        <input
                        type="date"
                        id="date of birth"
                        name="date of birth">
                </p>
            </fieldset>

                <fieldset>
                    <legend>Credentials</legend>
                    <p>
                        <label for="Username">
                           Username
                        </label>
                        <br>

                        <input
                            type="text"
                            id="username"
                            name="user"
                            required
                            placeholder="username"
                        >
                    </p>
                        <label for="password">
                           password
                        </label>
                        <br>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder=" password"
                            required
                        >
                    </p>
                      <p>
                        <label for=" confirm-password">
                          Confirm password
                        </label>
                        <br>

                        <input
                            type="password"
                            id="con-password"
                            name="password"
                            placeholder="confirm password"
                            required
                        >
                    </p>   
                </fieldset>
                <button type="button" id="deleteInputs">Delete</button>
            </form>
        </main>
        <script>
            document.getElementById("deleteInputs").addEventListener("click", () => {
                document.querySelectorAll("form input").forEach((input) => {
                    input.value = "";
                });
            });
        </script>
    </body>
</html>
