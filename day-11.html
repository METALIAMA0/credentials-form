<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniel DataWorld</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* Navigation */
        .nav {
            background-color: #263b50;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            left: 0;
            right: 0;
        }

        .nav h1 {
            color: white;
            margin-right: auto;
            font-size: 24px;
        }

        .nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav a:hover {
            color: #75c9ff;
        }

        /* Main section */
        .section {
            text-align: center;
            padding: 100px 20px;
            background-color: #dceaf5;
            min-height: 500px;
        }

        .section h1 {
            font-size: 36px;
            color: #263b50;
            margin-bottom: 20px;
        }

        .section p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 10px;
        }

        .section button {
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #263b50;
            border: none;
            border-radius: 5px;
        }

        .section button a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .section button:hover {
            background-color: #41617f;
        }

        .credentials {
            display: inline-block;
            padding: 12px;
            background-color: #263b50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .credentials:hover {
            background-color: #41617f;
        }

        .menu-toggle {
            font-size: 24px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 600px) {
            .nav {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
            }

            .menu-toggle {
                display: block;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
            }

            .nav.show .nav-links {
                display: flex;
            }

            .nav a {
                margin-top: 10px;
                width: 100%;
                font-size: 18px;
            }

            .section h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="nav">
            <button onclick="toggleMenu()" class="menu-toggle" id="menuToggle">&#9776;</button>

            <h1>Daniel DataWorld</h1>

            <div class="nav-links" id="navLinks">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="credentials.html">Credentials</a>
            </div>
        </nav>
    </header>

    <main>

        <section class="section" id="home">

            <h1>Hi, I am Daniel DataWorld</h1>

            <p>I am a data analyst and a web developer.</p>

            <p id="about">
                I am passionate about web development and extracting
                meaningful insights from data.
            </p>

            <button>
                <a href="#about">About Me</a>
            </button>

            <a href="credentials.html" class="credentials" id="credentials">
                Submit credentials
            </a>

        </section>

    </main>

    <script>
        function toggleMenu() {
            const nav = document.querySelector('.nav');
            nav.classList.toggle('show'); 
        }
    </script>

</body>
</html>
